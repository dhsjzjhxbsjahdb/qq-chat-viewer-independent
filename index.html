<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>纸蝶</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23009bf0'/%3E%3Cpath d='M8 8h16v12H14l-6 5z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="主导航">
    <img class="rail-avatar" src="avatars/me.jpg" alt="">
    <button class="rail-btn selected" data-tab="dates" title="消息" aria-label="按日期浏览">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M20 11.5c0 4.1-3.6 7.2-8 7.2-1 0-2-.2-2.9-.5L4 20l1.2-3.6A7 7 0 0 1 4 11.5C4 7.4 7.6 4.3 12 4.3s8 3.1 8 7.2Z"/></svg>
    </button>
    <button class="rail-btn" data-tab="events" title="事件" aria-label="事件导航">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 21V4m0 0h11l-2 4 2 4H5"/></svg>
    </button>
    <button class="rail-btn" id="railSearch" title="搜索 (/)" aria-label="搜索聊天记录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4" stroke-linecap="round"/></svg>
    </button>
  </nav>

  <aside id="sidebar" class="sidebar">
    <div class="conv">
      <img class="conv-avatar" src="avatars/peer.jpg" alt="">
      <div class="conv-body">
        <div class="conv-top"><strong id="peerName">纸蝶</strong><time id="lastTime"></time></div>
        <p id="lastMsg"></p>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="dates" class="tab active">日期</button>
      <button role="tab" data-tab="events" class="tab">事件</button>
    </div>
    <section id="panelDates" class="panel">
      <div id="dateList" class="date-list"></div>
    </section>
    <section id="panelEvents" class="panel hidden">
      <div id="eventFilters" class="chips"></div>
      <div id="eventList" class="event-list"></div>
    </section>
  </aside>

  <div class="main">
    <header class="chat-header">
      <button id="menuBtn" class="icon-btn mobile" aria-label="打开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="header-title">
        <h2 id="headerPeer">纸蝶</h2>
        <p id="headerDate"></p>
      </div>
      <label class="icon-btn date-btn" title="跳转到日期">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4m6-4v4"/></svg>
        <input id="jumpDate" type="date" aria-label="跳转到日期">
      </label>
      <button id="searchBtn" class="icon-btn" title="搜索 (/)" aria-label="搜索聊天记录">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div class="chat-area">
      <main id="chatWrap" class="chat-wrap" tabindex="0" aria-label="聊天消息">
        <div id="chat" class="chat"></div>
      </main>
      <div id="datePill" class="date-pill hidden"></div>
      <button id="nextEv" class="to-latest hidden" aria-label="跳到下一个事件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>

      <aside id="searchPanel" class="search-panel hidden" aria-label="搜索聊天记录">
        <div class="search-head">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4" stroke-linecap="round"/></svg>
            <input id="searchInput" type="search" placeholder="搜索" aria-label="搜索关键词" autocomplete="off">
          </div>
          <button id="closeSearch" class="icon-btn" aria-label="关闭搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="search-filter">
          <button data-who="all" class="chip active">全部</button>
          <button data-who="0" class="chip">纸蝶</button>
          <button data-who="1" class="chip">音</button>
          <span id="searchCount"></span>
        </div>
        <div id="searchResults" class="search-results"></div>
      </aside>
    </div>
  </div>
</div>
<div id="backdrop" class="backdrop hidden"></div>
<div id="toast" role="status" class="toast hidden"></div>
<noscript>请启用 JavaScript。</noscript>
<script src="data.js?v=8"></script>
<script src="notes.js?v=3"></script>
<script src="app.js?v=24"></script>
</body>
</html>
